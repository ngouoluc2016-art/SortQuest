# Construit l'APK de SortQuest sur les serveurs de GitHub (gratuit pour un dépôt privé dans
# la limite des minutes incluses). Aucun outil à installer sur ton ordinateur.
#
# Déclenchement : à chaque envoi de code, ou manuellement (onglet Actions > Build APK > Run workflow).
# Résultat : onglet Actions > dernière exécution > section "Artifacts" > SortQuest-APK (zip).
name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write   # nécessaire uniquement pour publier une "Release" sur un tag v*

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' }}

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Préparer Gradle (avec cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Accepter les licences du SDK Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      # Optionnel : signature "officielle" (Google Play). Sans ces secrets, l'APK release est
      # signé avec une clé de debug : installable directement, mais pas publiable sur le Play Store.
      - name: Configurer la clé de signature (si fournie)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > keystore.properties <<EOF
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Tests unitaires
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Construire les APK (debug + release optimisé)
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Renommer les APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/SortQuest-1.0.0.apk
          cp app/build/outputs/apk/debug/app-debug.apk dist/SortQuest-1.0.0-debug.apk
          ls -la dist

      - name: Publier les APK
        uses: actions/upload-artifact@v4
        with:
          name: SortQuest-APK
          path: dist/*.apk
          retention-days: 30

      - name: Publier le mapping R8 (traces de crash)
        uses: actions/upload-artifact@v4
        with:
          name: mapping-r8
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: ignore

      # En cas d'échec : rapports de compilation et de tests, à transmettre pour correction
      - name: Rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-erreur
          path: |
            app/build/reports/
            app/build/outputs/logs/
          if-no-files-found: ignore

      # Release GitHub : page de téléchargement directe (ouvrable depuis le téléphone)
      - name: Publier la Release v1.0.0
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: SortQuest 1.0.0
          target_commitish: ${{ github.sha }}
          files: dist/*.apk
          body: |
            **Installer :** télécharger `SortQuest-1.0.0.apk`, l'ouvrir sur le téléphone, autoriser l'installation depuis cette source.
            Android 8.0 minimum. `SortQuest-1.0.0-debug.apk` = version de diagnostic.

      # Copie des APK sur la branche "apk" (récupérable avec git, sans passer par le stockage des artefacts)
      - name: Publier les APK sur la branche apk
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/apk && cp dist/*.apk /tmp/apk/
          git checkout --orphan apk
          git rm -rq --cached . && git clean -fdxq -e dist
          cp /tmp/apk/*.apk .
          git add *.apk
          git commit -qm "APK ${GITHUB_SHA::7}"
          git push -f origin apk
