# Test de l'APK release sur un vrai émulateur Android 14 : parcours utilisateur, captures, détection de crash.
name: Smoke test (émulateur)

on:
  workflow_dispatch:
  workflow_run:
    workflows: [ "Build APK" ]
    types: [ completed ]

permissions:
  contents: write

jobs:
  smoke:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Construire l'APK release
        run: ./gradlew assembleRelease --stacktrace

      - name: Activer KVM (accélération de l'émulateur)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Lancer l'émulateur et le parcours de test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/smoke_test.sh

      - name: Publier les résultats sur la branche smoke
        if: always()
        run: |
          [ -d smoke-out ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp -r smoke-out /tmp/smoke-out
          git checkout --orphan smoke
          git rm -rq --cached . && git clean -fdxq
          cp -r /tmp/smoke-out/. .
          git add -A
          git commit -qm "Smoke test ${GITHUB_SHA::7}"
          git push -f origin smoke

      - name: Résultats (artefact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test
          path: smoke-out/
          if-no-files-found: ignore
